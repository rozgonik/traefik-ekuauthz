---
on:
  push:
    branches: ["master"]
  pull_request:

jobs:
  go-test:
    name: Run go test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.19'

      - name: Test
        run: go test
